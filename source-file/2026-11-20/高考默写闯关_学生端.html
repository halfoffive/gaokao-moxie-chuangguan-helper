<!DOCTYPE html>
<!-- 脱敏参考版：真实学生姓名、学号已替换为占位数据，收集表链接已清空；原版不入库。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>古诗文闯关 · 默写挑战</title>
<style>
:root{--bg:#faf6ee;--ink:#2b2b28;--sub:#7b7568;--green:#2f5d50;--green2:#3c7867;--red:#c1453b;--gold:#c9972f;--line:#e6ddc9;--card:#fffdf8;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;font-size:16px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.hud{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--green);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:14px;box-shadow:0 3px 0 #23463c}
.hud .wk{font-size:12px;opacity:.85;letter-spacing:.5px}
.hud b{font-size:19px}
.chip{background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
.bar{height:6px;background:#e6ddc9;border-radius:99px;overflow:hidden;margin:0 0 14px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;box-shadow:0 4px 18px rgba(60,50,30,.06)}
.tag{display:inline-block;font-size:12px;color:var(--green);background:#eaf3ef;border-radius:999px;padding:2px 10px;margin-bottom:8px}
.src{font-size:12px;color:var(--sub);margin-bottom:12px}
.sent{font-size:23px;line-height:2;letter-spacing:1px;text-align:center;margin:14px 0 20px;font-family:"Kaiti SC","STKaiti","KaiTi",serif;word-break:break-all}
.blank{color:var(--red);font-weight:700;border-bottom:2px solid var(--red);padding:0 4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font-family:inherit;font-size:16px;cursor:pointer;border:none;border-radius:12px;padding:13px 10px;background:#f2ecdd;color:var(--ink);transition:transform .1s,background .15s}
button:active{transform:scale(.97)}
.opt{font-size:26px;font-family:"Kaiti SC","STKaiti","KaiTi",serif;padding:10px}
.opt.ok{background:#dff0e6;color:#1d6b45}
.opt.no{background:#fbe3e0;color:#a8332a}
.btn{background:var(--green);color:#fff;width:100%;font-weight:600;margin-top:12px}
.btn:disabled{opacity:.45}
.btn.ghost{background:#f2ecdd;color:var(--ink);font-weight:400}
.btn.red{background:var(--red)}
.btn.gold{background:var(--gold)}
.hint{font-size:13px;color:var(--sub);text-align:center;margin-top:12px;min-height:20px}
.py{text-align:center;color:var(--gold);font-size:15px;letter-spacing:2px;margin:-6px 0 4px}
.inp{width:100%;text-align:center;font-size:34px;font-family:"Kaiti SC","STKaiti",serif;border:2px solid var(--line);border-radius:12px;padding:8px;background:#fff;color:var(--ink)}
.combo{text-align:center;color:var(--red);font-weight:700;font-size:14px;height:20px}
.title{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.sub{font-size:13px;color:var(--sub);text-align:center;margin-bottom:18px}
select,input.txt{width:100%;font-size:16px;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-bottom:10px}
label{font-size:13px;color:var(--sub);display:block;margin:8px 0 4px}
.ucode{width:100%;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:2px;text-transform:uppercase;border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--ink);margin-bottom:4px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mi{background:#f2ecdd;border-radius:10px;padding:10px 8px;font-size:14px;text-align:center;cursor:pointer;font-family:"Kaiti SC","STKaiti",serif;line-height:1.4}
.mi.sel{background:#f7dfa8;outline:2px solid var(--gold)}
.mi.gone{opacity:.22;pointer-events:none;background:#dff0e6}
.mi.bad{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hunt span{cursor:pointer;padding:1px 2px;border-radius:5px}
.hunt span:hover{background:#f7dfa8}
.hunt span.picked{background:var(--red);color:#fff}
.code{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;padding:12px;border:2px dashed var(--gold);border-radius:12px;background:#fffdf3;color:#4a3d1c;word-break:break-all;min-height:76px}
.wronglist{margin-top:14px;text-align:left;font-size:14px}
.wronglist div{padding:7px 0;border-bottom:1px dashed var(--line)}
.wronglist em{font-style:normal;color:var(--red);font-weight:700}
.wronglist s{color:var(--sub)}
.goldbg{background:linear-gradient(160deg,#fff8e2,#f6e3b0);border-color:#e2c373}
.tada{font-size:44px;text-align:center;line-height:1.2}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.cf{position:absolute;width:9px;height:16px;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
.stat{display:flex;justify-content:space-around;text-align:center;margin:16px 0}
.stat b{display:block;font-size:24px;color:var(--green)}
.stat small{color:var(--sub);font-size:12px}
.note{font-size:12px;color:var(--sub);line-height:1.7;background:#f6f1e4;border-radius:12px;padding:12px;margin-top:14px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.mini{font-size:12px;color:var(--sub);text-align:center;margin-top:10px}
.pill{display:inline-block;background:#eaf3ef;color:var(--green);border-radius:999px;padding:2px 9px;font-size:12px;margin:2px}
@media(min-width:600px){.sent{font-size:27px}}
</style>
</head>

歌行":4,"蜀相":4,"客至":4,"登高":4,"登岳阳楼":4,"琵琶行（并序）":4,"李凭箜篌引":4,"菩萨蛮":4,"锦瑟":5,"虞美人":5,"望海潮":5,"桂枝香·金陵怀古":5,"江城子·乙卯正月二十日夜记梦":5,"念奴娇·赤壁怀古":5,"登快阁":5,"鹊桥仙":5,"苏幕遮":5,"声声慢":5,"书愤":6,"临安春雨初霁":6,"念奴娇·过洞庭":6,"永遇乐·京口北固亭怀古":6,"菩萨蛮·书江西造口壁":6,"青玉案·元夕":6,"贺新郎":6,"扬州慢":6,"长亭送别（【正宫】【端正好】）":6,"朝天子·咏喇叭":6},"quotes":{"《论语》十二章":["君子食无求饱，居无求安，敏于事而慎于言","朝闻道，夕死可矣","见贤思齐焉，见不贤而内自省也","士不可以不弘毅，任重而道远","己所不欲，勿施于人","克己复礼为仁","知者不惑，仁者不忧，勇者不惧","譬如为山，未成一篑，止，吾止也","可谓好学也已","质胜文则野","不亦重乎","死而后已","虽覆一篑","天下归仁焉","请问其目","非礼勿视","请事斯语矣"],"劝学":["青，取之于蓝，而青于蓝","君子博学而日参省乎己，则知明而行无过矣","故不积跬步，无以至千里","锲而不舍，金石可镂","蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也","君子生非异也，善假于物也","虽有槁暴，不复挺者","木受绳则直，金就砺则利","学不可以已","不如须臾之所学也","吾尝跂而望矣","声非加疾也","假舆马者","驽马十驾","锲而舍之"],"屈原列传（节选）":["屈平疾王听之不聪也，谗谄之蔽明也","其称文小而其指极大，举类迩而见义远","推此志也，虽与日月争光可也","故忧愁幽思而作","犹离忧也","人穷则反本","疾痛惨怛","信而见疑","好色而不淫","靡不毕见","自疏濯淖污泥之中","蝉蜕于浊秽","以浮游尘埃之外","不获世之滋垢","皭然泥而不滓者也"],"谏太宗十思疏":["求木之长者，必固其根本","思国之安者，必积其德义","有善始者实繁，能克终者盖寡","载舟覆舟，所宜深慎","必浚其泉源","人君当神器之重","将崇极天之峻","承天景命","功成而德衰","夫在殷忧","竭诚则胡越为一体","虽董之以严刑","貌恭而不心服","诚能见可欲则思知足以自戒","乐盘游则思三驱以为度","忧懈怠则思慎始而敬终","恩所加则思无因喜以谬赏","罚所及则思无因怒而滥刑","弘兹九德","则智者尽其谋","勇者竭其力","仁者播其惠","信者效其忠","文武争驰","可以尽豫游之乐","鸣琴垂拱","役聪明之耳目","亏无为之大道哉"],"师说":["古之学者必有师","师者，所以传道受业解惑也","人非生而知之者，孰能无惑","是故无贵无贱，无长无少，道之所存，师之所存也","位卑则足羞，官盛则近谀","弟子不必不如师，师不必贤于弟子","或师焉，或不焉，小学而大遗，吾未见其明也","其闻道也固先乎吾","师道之不传也久矣","欲人之无惑也难矣","其出人也远矣","是故圣益圣","君子不齿","圣人无常师","如是而已","余嘉其能行古道"],"阿房宫赋":["六王毕，四海一，蜀山兀，阿房出","廊腰缦回，檐牙高啄","秦人不暇自哀，而后人哀之","后人哀之而不鉴之，亦使后人而复哀后人也","骊山北构而西折","钩心斗角","蜂房水涡","不霁何虹","高低冥迷","而气候不齐","妃嫔媵嫱","辇来于秦","梳晓鬟也","渭流涨腻","焚椒兰也","杳不知其所之也","而望幸焉","剽掠其人","金块珠砾","奈何取之尽锱铢","架梁之椽","多于在庾之粟粒","多于周身之帛缕","直栏横槛","谁得而族灭也","秦人不暇自哀","亦使后人而复哀后人也"],"六国论":["六国破灭，非兵不利，战不善，弊在赂秦","思厥先祖父，暴霜露，斩荆棘","以地事秦，犹抱薪救火","率赂秦耶","弊在赂秦也","诸侯之所亡","固不在战矣","如弃草芥","然后得一夕安寝","奉之弥繁","至于颠覆","与嬴而不助五国也","五国既丧","洎牧以谗诛","邯郸为郡","则吾恐秦人食之不得下咽也","而为秦人积威之所劫","以趋于亡","为国者无使为积威之所劫哉","其势弱于秦","苟以天下之大","下而从六国破亡之故事"],"答司马谏议书":["某启：昨日蒙教","名实已明，而天下之理得矣","至于怨诽之多，则固前知其如此也","不复一一自辨","虽欲强聒","终必不蒙见察","于反覆不宜卤莽","冀君实或见恕也","尤在于名实","以致天下怨谤也","人习于苟且非一日","士大夫多以不恤国事","而某不量敌之众寡","胥怨者民也","度义而后动","以膏泽斯民","无由会晤"],"赤壁赋":["清风徐来，水波不兴","月出于东山之上，徘徊于斗牛之间","白露横江，水光接天","纵一苇之所如，凌万顷之茫然","浩浩乎如冯虚御风","寄蜉蝣于天地，渺沧海之一粟","哀吾生之须臾，羡长江之无穷","惟江上之清风，与山间之明月","山川相缪，郁乎苍苍","举匏樽以相属","举酒属客","歌窈窕之章","扣舷而歌之","桂棹兮兰桨","客有吹洞箫者","舞幽壑之潜蛟","泣孤舟之嫠妇","舳舻千里","横槊赋诗","侣鱼虾而友麋鹿","则天地曾不能以一瞬","杯盘狼籍"],"项脊轩志":["室仅方丈，可容一人居","三五之夜，明月半墙，桂影斑驳","庭有枇杷树，吾妻死之年所手植也","某所，而母立于兹","尘泥渗漉","余稍为修葺","前辟四窗","旧时栏楯","偃仰啸歌","万籁有声","迨诸父异爨","客逾庖而宴","庭中始为篱","汝姊在吾怀","娘以指叩门扉曰","何竟日默默在此","大类女郎也","以手阖门","持一象笏至","余扃牖而居","殆有神护者","或凭几学书","吾妻归宁","乃使人复葺南阁子"],"子路、曾晳、冉有、公西华侍坐":["以吾一日长乎尔，毋吾以也","莫春者，春服既成","浴乎沂，风乎舞雩，咏而归","鼓瑟希，铿尔，舍瑟而作","不吾知也","摄乎大国之间","因之以饥馑","比及三年","夫子哂之","以俟君子","异乎三子者之撰","冠者五六人","宗庙会同","孰能为之大"],"报任安书（节选）":["古者富贵而名摩灭，不可胜记","盖文王拘而演《周易》","屈原放逐，乃赋《离骚》","《诗》三百篇，大底圣贤发愤之所为作也","亦欲以究天人之际，通古今之变，成一家之言","网罗天下放失旧闻","则仆偿前辱之责，虽万被戮，岂有悔哉","唯倜傥非常之人称焉","孙子膑脚","思垂空文以自见","仆窃不逊","近自托于无能之辞","稽其成败兴坏之纪","上计轩辕","草创未就","已就极刑而无愠色","通邑大都"],"过秦论（上）":["秦孝公据崤函之固，拥雍州之地","有席卷天下，包举宇内，囊括四海之意，并吞八荒之心","一夫作难而七庙隳，身死人手，为天下笑者","仁义不施而攻守之势异也","合从缔交，相与为一","赢粮而景从","外连衡而斗诸侯","东割膏腴之地","以致天下之士","宽厚而爱人","约从离衡","逡巡而不敢进","秦无亡矢遗镞之费","于是从散约败","流血漂橹","宰割天下","振长策而御宇内","履至尊而制六合","执敲扑而鞭笞天下","乃使蒙恬北筑长城而守藩篱","士不敢弯弓而报怨","以愚黔首","良将劲弩守要害之处","信臣精卒陈利兵而谁何","自以为关中之固","子孙帝王万世之业也","始皇既没","余威震于殊俗","而迁徙之徒也","墨翟之贤","猗顿之富","山东豪俊遂并起而亡秦族矣","非铦于钩戟长铩也","非及乡时之士也","试使山东之国与陈涉度长絜大","百有余年矣"],"礼运（节选）":["大道之行也，天下为公","选贤与能，讲信修睦","是故谋闭而不兴，盗窃乱贼而不作","使老有所终，壮有所用，幼有所长","矜寡孤独废疾者皆有所养","货恶其弃于地也"],"陈情表":["臣以险衅，夙遭闵凶","零丁孤苦，至于成立","茕茕孑立，形影相吊","但以刘日薄西山，气息奄奄","乌鸟私情，愿乞终养","臣密今年四十有四，祖母今年九十有六","慈父见背","舅夺母志","祖母刘愍臣孤弱","门衰祚薄","内无应门五尺之僮","而刘夙婴疾病","常在床蓐","逮奉圣朝","前太守臣逵察臣孝廉","除臣洗马","非臣陨首所能上报","诏书切峻","则刘病日笃","伏惟圣朝以孝治天下","犹蒙矜育","不矜名节","过蒙拔擢","祖母今年九十有六","臣生当陨首"],"归去来兮辞（并序）":["归去来兮，田园将芜胡不归","悟已往之不谏，知来者之可追","舟遥遥以轻飏，风飘飘而吹衣","云无心以出岫，鸟倦飞而知还","木欣欣以向荣，泉涓涓而始流","景翳翳以将入，抚孤松而盘桓","既自以心为形役","恨晨光之熹微","有酒盈樽","策扶老以流憩","或棹孤舟","感吾生之行休","寓形宇内复几时","曷不委心任去留","或植杖而耘耔","临清流而赋诗","乐夫天命复奚疑"],"种树郭橐驼传":["橐驼非能使木寿且孳也","顺木之天，以致其性焉尔","其莳也若子，其置也若弃","早缫而绪，早织而缕，字而幼孩","隆然伏行","有类橐驼者","他植者虽窥伺效慕","其培欲平","其筑欲密","则其天者全而其性得矣","不抑耗其实而已","根拳而土易","而木之性日以离矣","其实仇之","见长人者好烦其令","旦暮吏来而呼曰","遂而鸡豚","吾小人辍飧饔以劳吏者","且不得暇","则与吾业者其亦有类乎","传其事以为官戒也"],"五代史伶官传序":["盛衰之理，虽曰天命，岂非人事哉","忧劳可以兴国，逸豫可以亡身","夫祸患常积于忽微，而智勇多困于所溺","及仇雠已灭，天下已定","原庄宗之所以得天下","吾遗恨也","尔其无忘乃父之志","盛以锦囊","及凯旋而纳之","方其系燕父子以组","函梁君臣之首","仓皇东出","至于誓天断发","泣下沾襟","抑本其成败之迹","而皆自于人欤","数十伶人困之","岂独伶人也哉"],"石钟山记":["微风鼓浪，水石相搏，声如洪钟","大石侧立千尺，如猛兽奇鬼","事不目见耳闻，而臆断其有无，可乎","至暮夜月明，独与迈乘小舟，至绝壁下","彭蠡之口有石钟山焉","而山上栖鹘","噌吰如钟鼓不绝","下皆石穴罅","涵澹澎湃而为此也","与向之噌吰者相应","而陋者乃以斧斤考击而求之"],"登泰山记":["泰山之阳，汶水西流","极天云一线异色，须臾成五采","日上，正赤如丹，下有红光动摇承之","石苍黑色，多平方，少圜","道皆砌石为磴","余始循以入","遂至其巅","磴几不可登","绛皓驳色","而皆若偻","其远古刻尽漫失"],"静女":["静女其姝，俟我于城隅","爱而不见，搔首踟蹰","彤管有炜，说怿女美","自牧归荑，洵美且异","匪女之为美，美人之贻"],"无衣":["岂曰无衣？与子同袍","王于兴师，修我戈矛，与子同仇","与子同泽","与子偕作","与子偕行","修我矛戟","与子同裳"],"离骚（节选）":["帝高阳之苗裔兮，朕皇考曰伯庸","纷吾既有此内美兮，又重之以修能","汩余若将不及兮，恐年岁之不吾与","摄提贞于孟陬兮，惟庚寅吾以降","皇览揆余初度兮，肇锡余以嘉名","名余曰正则兮，字余曰灵均","扈江离与辟芷兮，纫秋兰以为佩","日月忽其不淹兮，春与秋其代序","乘骐骥以驰骋兮，来吾道夫先路","朝搴阰之木兰兮","夕揽洲之宿莽","惟草木之零落兮"],"涉江采芙蓉":["涉江采芙蓉，兰泽多芳草","还顾望旧乡，长路漫浩浩","同心而离居，忧伤以终老","采之欲遗谁"],"短歌行":["对酒当歌，人生几何","譬如朝露，去日苦多","青青子衿，悠悠我心","呦呦鹿鸣，食野之苹","明明如月，何时可掇","山不厌高，海不厌深","周公吐哺，天下归心","慨当以慷","唯有杜康","契阔谈讌","乌鹊南飞","绕树三匝"],"归园田居（其一）":["少无适俗韵，性本爱丘山","羁鸟恋旧林，池鱼思故渊","暧暧远人村，依依墟里烟","久在樊笼里，复得返自然","榆柳荫后檐","鸡鸣桑树颠"],"拟行路难（其四）":["泻水置平地，各自东西南北流","人生亦有命，安能行叹复坐愁","心非木石岂无感？吞声踯躅不敢言","鲍照泻水置平地"],"春江花月夜":["春江潮水连海平，海上明月共潮生","江流宛转绕芳甸，月照花林皆似霰","江天一色无纤尘，皎皎空中孤月轮","江畔何人初见月？江月何年初照人","人生代代无穷已，江月年年望相似","鸿雁长飞光不度，鱼龙潜跃水成文","青枫浦上不胜愁","谁家今夜扁舟子","可怜楼上月裴回","应照离人妆镜台","捣衣砧上拂还来","碣石潇湘无限路"],"山居秋暝":["空山新雨后，天气晚来秋","明月松间照，清泉石上流","竹喧归浣女，莲动下渔舟","随意春芳歇，王孙自可留"],"蜀道难":["噫吁嚱，危乎高哉","蜀道之难，难于上青天","西当太白有鸟道，可以横绝峨眉巅","地崩山摧壮士死，然后天梯石栈相钩连","扪参历井仰胁息，以手抚膺坐长叹","一夫当关，万夫莫开","青泥何盘盘，百步九折萦岩峦","连峰去天不盈尺，枯松倒挂倚绝壁","所守或匪亲，化为狼与豺","蚕丛及鱼凫","尔来四万八千岁","猿猱欲度愁攀援","畏途岩不可攀","雄飞雌从绕林间","又闻子规啼夜月","使人听此凋朱颜","湍瀑流争喧豗","砯崖转石万壑雷","剑阁峥嵘而崔嵬","侧身西望长咨嗟"],"梦游天姥吟留别":["海客谈瀛洲，烟涛微茫信难求","天姥连天向天横，势拔五岳掩赤城","我欲因之梦吴越，一夜飞度镜湖月","安能摧眉折腰事权贵，使我不得开心颜","列缺霹雳，丘峦崩摧","对此欲倒东南倾","送我至剡溪","渌水荡漾清猿啼","半壁见海日","迷花倚石忽已暝","栗深林兮惊层巅","訇然中开","青冥浩荡不见底","霓为衣兮风选自","虎鼓瑟兮鸾回车","忽魂悸以魄动","惟觉时之枕席","且放白鹿青崖间"],"将进酒":["君不见黄河之水天上来，奔流到海不复回","人生得意须尽欢，莫使金樽空对月","天生我材必有用，千金散尽还复来","古来圣贤皆寂寞，惟有饮者留其名","钟鼓馔玉不足贵","但愿长醉不愿醒","斗酒十千恣欢谑","与尔同销万古愁"],"燕歌行":["汉家烟尘在东北，汉将辞家破残贼","战士军前半死生，美人帐下犹歌舞","相看白刃血纷纷，死节从来岂顾勋","校尉羽书飞瀚海，单于猎火照狼山","大漠穷秋塞草腓，孤城落日斗兵稀","天子非常赐颜色","金伐鼓下榆关","山川萧条极边土","玉箸应啼别离后","征人蓟北空回首","边庭飘飖那可度","寒声一夜传刁斗"],"蜀相":["丞相祠堂何处寻，锦官城外柏森森","映阶碧草自春色，隔叶黄鹂空好音","三顾频烦天下计，两朝开济老臣心","出师未捷身先死，长使英雄泪满襟"],"客至":["舍南舍北皆春水，但见群鸥日日来","花径不曾缘客扫，蓬门今始为君开","盘飧市远无兼味，樽酒家贫只旧醅"],"登高":["风急天高猿啸哀，渚清沙白鸟飞回","无边落木萧萧下，不尽长江滚滚来","万里悲秋常作客，百年多病独登台","艰难苦恨繁霜鬓，潦倒新停浊酒杯"],"登岳阳楼":["昔闻洞庭水，今上岳阳楼","吴楚东南坼，乾坤日夜浮","亲朋无一字，老病有孤舟","戎马关山北，凭轩涕泗流"],"琵琶行（并序）":["浔阳江头夜送客，枫叶荻花秋瑟瑟","千呼万唤始出来，犹抱琵琶半遮面","大弦嘈嘈如急雨，小弦切切如私语","别有幽愁暗恨生，此时无声胜有声","东船西舫悄无言，唯见江心秋月白","同是天涯沦落人，相逢何必曾相识","座中泣下谁最多？江州司马青衫湿","别时茫茫江浸月","转轴拨弦三两声","嘈嘈切切错杂弹","间关莺语花底滑","冰泉冷涩弦凝绝","银瓶乍破水浆迸","曲终收拨当心画","钿头银篦击节碎","前月浮梁买茶去","梦啼妆泪红阑干","谪居卧病浔阳城","住近湓江地低湿","其间旦暮闻何物","往往取酒还独倾","呕哑嘲哳难为听"],"李凭箜篌引":["吴丝蜀桐张高秋，空山凝云颓不流","昆山玉碎凤凰叫，芙蓉泣露香兰笑","女娲炼石补天处，石破天惊逗秋雨","江娥啼竹素女愁","梦入神山教神妪","露脚斜飞湿寒兔"],"菩萨蛮":["小山重叠金明灭，鬓云欲度香腮雪","懒起画蛾眉，弄妆梳洗迟","照花前后镜，花面交相映","新贴绣罗襦，双双金鹧鸪"],"锦瑟":["锦瑟无端五十弦，一弦一柱思华年","庄生晓梦迷蝴蝶，望帝春心托杜鹃","沧海月明珠有泪，蓝田日暖玉生烟","此情可待成追忆，只是当时已惘然"],"虞美人":["春花秋月何时了，往事知多少","小楼昨夜又东风，故国不堪回首月明中","雕栏玉砌应犹在，只是朱颜改","问君能有几多愁，恰似一江春水向东流"],"望海潮":["东南形胜，三吴都会，钱塘自古繁华","烟柳画桥，风帘翠幕，参差十万人家","云树绕堤沙，怒涛卷霜雪，天堑无涯","有三秋桂子，十里荷花","重湖叠清嘉","菱歌泛夜","千骑拥高牙"],"桂枝香·金陵怀古":["登临送目，正故国晚秋，天气初肃","千里澄江似练，翠峰如簇","归帆去棹残阳里，背西风，酒旗斜矗","六朝旧事随流水，但寒烟衰草凝绿","星河鹭起","谩嗟荣辱"],"江城子·乙卯正月二十日夜记梦":["十年生死两茫茫，不思量，自难忘","千里孤坟，无处话凄凉","料得年年肠断处，明月夜，短松冈","惟有泪千行"],"念奴娇·赤壁怀古":["大江东去，浪淘尽，千古风流人物","乱石穿空，惊涛拍岸，卷起千堆雪","遥想公瑾当年，小乔初嫁了，雄姿英发","羽扇纶巾，谈笑间，樯橹灰飞烟灭","人生如梦，一尊还酹江月","故垒西边"],"登快阁":["痴儿了却公家事，快阁东西倚晚晴","落木千山天远大，澄江一道月分明","朱弦已为佳人绝，青眼聊因美酒横","万里归船弄长笛，此心吾与白鸥盟"],"鹊桥仙":["纤云弄巧，飞星传恨，银汉迢迢暗度","金风玉露一相逢，便胜却人间无数","两情若是久长时，又岂在朝朝暮暮","忍顾鹊桥归路"],"苏幕遮":["燎沉香，消溽暑","鸟雀呼晴，侵晓窥檐语","叶上初阳干宿雨，水面清圆，一一风荷举","苏幕遮周邦彦燎沉香","小楫轻舟"],"声声慢":["寻寻觅觅，冷冷清清，凄凄惨惨戚戚","乍暖还寒时候，最难将息","三杯两盏淡酒，怎敌他、晚来风急","满地黄花堆积，憔悴损","梧桐更兼细雨，到黄昏、点点滴滴"],"书愤":["早岁那知世事艰，中原北望气如山","楼船夜雪瓜洲渡，铁马秋风大散关","塞上长城空自许，镜中衰鬓已先斑","出师一表真名世，千载谁堪伯仲间"],"临安春雨初霁":["世味年来薄似纱，谁令骑马客京华","小楼一夜听春雨，深巷明朝卖杏花","矮纸斜行闲作草，晴窗细乳戏分茶","临安春雨初霁陆游世味年来薄似 const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
function weekNo(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/86400000+1)/7)}
function weekKey(d){return d.getFullYear()+"-W"+String(weekNo(d)).padStart(2,'0')}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function beep(ok){if(!CFG.SOUND)return;try{const C=new(window.AudioContext||window.webkitAudioContext)();const o=C.createOscillator(),g=C.createGain();o.connect(g);g.connect(C.destination);o.type='sine';o.frequency.value=ok?880:220;g.gain.setValueAtTime(.08,C.currentTime);g.gain.exponentialRampToValueAtTime(.001,C.currentTime+.16);o.start();o.stop(C.currentTime+.17)}catch(e){}}
/* 成绩码：UTF-8 -> base64url + 校验位 */
function b64e(s){const b=new TextEncoder().encode(s);let x='';b.forEach(v=>x+=String.fromCharCode(v));return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const x=atob(s);const b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);return new TextDecoder().decode(b)}
function crc(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(16).slice(0,5).padStart(5,'0')}
function makeCode(d){const b=b64e(JSON.stringify(d));return "GM1."+b+"."+crc(b)}
function parseCode(c){c=c.trim();const m=c.match(/^GM1\.([A-Za-z0-9_-]+)\.([0-9a-f]{5})$/);if(!m)return null;if(crc(m[1])!==m[2])return null;try{return JSON.parse(b64d(m[1]))}catch(e){return null}}
/* ---- 防冒名：身份码指纹 / 设备 ID / 本机绑定 ---- */
function uidOf(code){return crc('GM2026|'+String(code).toUpperCase()).slice(0,5)}
function devId(){let d=localStorage.getItem('gm_dev');if(!d){d='D'+Math.random().toString(36).slice(2,10).toUpperCase();localStorage.setItem('gm_dev',d)}return d}
function bindInfo(){try{return JSON.parse(localStorage.getItem('gm_bind')||'null')}catch(e){return null}}
function setBind(o){localStorage.setItem('gm_bind',JSON.stringify(o))}
/* 状态 */
let S=null;
const LS='gm_v22_';
function save(){if(S)localStorage.setItem(LS+weekKey(new Date()),JSON.stringify(S))}
function load(){try{return JSON.parse(localStorage.getItem(LS+weekKey(new Date()))||'null')}catch(e){return null}}
function streak(){let n=0;const d=new Date();for(let i=0;i<20;i++){const k=weekKey(new Date(d.getTime()-i*7*86400000));if(localStorage.getItem('gm_done_'+k))n++;else if(i>0)break}return n}
const DAYCN=['日','一','二','三','四','五','六'];
/* 计分关卡是否开放：d 可传 {getDay:()=>n} 便于测试；EVERY_DAY 打开时不限制日期 */
function isOpenDay(d){const day=(d||new Date()).getDay();return CFG.EVERY_DAY||CFG.OPEN_DAYS.indexOf(day)>=0}
function openDaysText(){return CFG.OPEN_DAYS.slice().sort((a,b)=>(a||7)-(b||7)).map(d=>'周'+DAYCN[d]).join('、')}
function masked(p,ch){let s=p.s;s=s.slice(0,p.pos)+(ch||'＿')+s.slice(p.pos+1);return esc(s).replace(/＿/g,'<span class="blank">＿</span>')}
/* 易混句式（如《无衣》三章「与子同＿」）附教材原文上下文，学生才能判断该填哪个字 */
function ctxHtml(p){return p.ctx?'<div style="margin:8px 0;padding:8px 12px;background:#f6f2e7;border-left:3px solid #c9972f;border-radius:6px;font-size:14px;color:#7a6b4f;line-height:1.7">📖 上下文：'+esc(p.ctx)+'</div>':''}
/* ---- 组题：篇目全覆盖 + 按周轮换 ---- */
function sig(x){return (x.t||'')+'|'+(x.s||x.a||'')+'|'+(x.a||x.b||'')}
function byTitle(arr){const m={};arr.forEach(p=>(m[p.t]=m[p.t]||[]).push(p));return m}
function spread(by,n,r,prefer,used){
  const keys=Object.keys(by);
  const order=[...new Set([...(prefer||[]).filter(t=>by[t]),...shuffle(keys,r)])];
  const out=[];
  for(let round=0;out.length<n&&round<80;round++){
    let got=false;
    for(const t of order){
      if(out.length>=n)break;
      const p=shuffle(by[t],r).find(x=>!used.has(sig(x)));
      if(p){used.add(sig(p));out.push(p);got=true}
    }
    if(!got)break;
  }
  return out;
}
function buildRun(wk){
  const r=mulberry32(wk*7919+parseInt(today().replace(/-/g,''),10)%1000+13);
  const chBy=byTitle(BANK.choice), wrBy=byTitle(BANK.write);
  const titles=shuffle(Object.keys(BANK.quotes),r);
  const used=new Set(), covered=new Set();
  const ch=spread(chBy,CFG.N_CHOICE,r,titles,used); ch.forEach(p=>covered.add(p.t));
  const wr=spread(wrBy,CFG.N_WRITE,r,titles.filter(t=>!covered.has(t)),used); wr.forEach(p=>covered.add(p.t));
  const ht=spread(chBy,CFG.N_HUNT,r,titles.filter(t=>!covered.has(t)),used); ht.forEach(p=>covered.add(p.t));
  /* 连连看：一关只取一个篇目，方块全是该篇的短分句，彼此互为同篇迷惑项；
     优先挑其它题型还没覆盖到的篇目，兼顾 60 篇全覆盖 */
  const mb=BANK.match;
  const cand=titles.filter(t=>mb[t]&&mb[t].pairs.length>=3);
  const need=cand.filter(t=>!covered.has(t));
  const rest=shuffle(cand.filter(t=>covered.has(t)),r);
  const order=[...need,...rest];
  const nMatch=Math.max(CFG.N_MATCH,need.length);   // 缺几篇就补几关，保证全覆盖
  const groups=[];
  for(let i=0;i<nMatch&&i<order.length;i++){
    const t=order[i];
    const pool=shuffle(mb[t].pairs.slice(),r).slice(0,CFG.PER_MATCH);
    const ua=new Set(pool.map(x=>x.a)),ub=new Set(pool.map(x=>x.b));
    /* 干扰句优先取该篇没被本关用到的分句；短篇目不够时，用「与本关上句同文本」的句子补足，
       保证每关都混进 DECOY 条同篇迷惑项，短篇也不会变成一眼配完 */
    const cand=(mb[t].all||[]).filter(c=>!ub.has(c));
    const pref=shuffle(cand.filter(c=>!ua.has(c)),r), fallback=shuffle(cand.filter(c=>ua.has(c)),r);
    const decoys=pref.concat(fallback).slice(0,CFG.DECOY);
    groups.push({k:'match',t,pairs:pool,decoys});
    covered.add(t);
  }
  /* 题型按固定板块集中，绝不穿插；只把每个板块「内部」的篇目顺序打乱。
     想换板块先后，改 BLOCKS 数组顺序即可；不要用 interleave 跨题型打散。 */
  const BLOCKS=[
    ch.map(p=>({k:'choice',p})),
    wr.map(p=>({k:'write',p})),
    groups,
    ht.map(p=>({k:'hunt',p}))
  ];
  const out=[];
  BLOCKS.forEach(b=>out.push(...interleave(b,r)));
  return out;
}
/* 只打乱「篇目顺序」：在传入的队列（同一个题型板块）内，按清单02 的分册组
   （必修文言文 / 选择性必修文言文 / 诗词曲四段）轮流取一关，相邻两关不来自同一册。
   本函数只作用于单个题型板块，绝不跨题型调用，题型顺序因此保持完整。 */
function interleave(queue,r){
  const G=BANK.groups||{},buckets={};
  queue.forEach(q=>{
    const t=q.p?q.p.t:(q.t||'');
    const g=String(G[t]||0);
    (buckets[g]=buckets[g]||[]).push(q);
  });
  const keys=shuffle(Object.keys(buckets),r);
  keys.forEach(k=>{buckets[k]=shuffle(buckets[k],r)});
  const out=[]; let last=null;
  while(out.length<queue.length){
    /* 每次优先挑「与上一关不同组、且剩余题最多」的一组，尽量不出现相邻同册 */
    let cand=keys.filter(k=>buckets[k].length&&k!==last);
    if(!cand.length)cand=keys.filter(k=>buckets[k].length);
    if(!cand.length)break;
    cand.sort((a,b)=>buckets[b].length-buckets[a].length);
    const top=cand.filter(k=>buckets[k].length===buckets[cand[0]].length);
    const k=top[Math.floor(r()*top.length)];
    out.push(buckets[k].shift()); last=k;
  }
  return out;
}
function newRun(cls,name,free,auth){
  const wk=weekNo(new Date()),k=weekKey(new Date());
  S={cls,name,week:wk,wkey:k,free:!!free,u:auth.u,dv:auth.dv,sw:auth.sw||0,
     queue:buildRun(wk),qi:0,score:0,combo:0,maxCombo:0,
     right:0,total:0,writeRight:0,writeTotal:0,wrong:[],t0:Date.now(),elapsed:0,
     attempts:(parseInt(localStorage.getItem('gm_try_'+k)||'0',10)+1),match:null,hunt:null,done:false};
  localStorage.setItem('gm_try_'+k,String(S.attempts));
  save();
}
function hud(){if(!S)return;$('#wk').textContent=S.wkey+' · '+(S.free?'练习模式':'计分关卡');$('#who').textContent=S.name+' · '+S.cls;
  $('#score').textContent=S.score+' 分';$('#combo').textContent='连击 '+S.combo;
  $('#bar').style.width=(S.queue.length?Math.round(S.qi/S.queue.length*100):0)+'%'}
function addRight(){S.right++;S.total++;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);S.score+=10+(S.combo>=5?5:0)+(S.combo>=10?5:0);beep(true)}
function addWrong(p,ch){S.total++;S.combo=0;S.wrong.push({a:p.a,t:p.t,s:p.s,ch:ch||'（空）'});beep(false)}
function next(){S.qi++;S.match=null;S.hunt=null;save();hud();if(S.qi>=S.queue.length)finish();else showQ()}
function card(html){$('#screen').innerHTML='<div class="card">'+html+'</div>'}
function showQ(){
  const q=S.queue[S.qi];if(!q){finish();return}
  hud();
  const KNAME={choice:'火眼金睛 · 选字',write:'提笔验字',match:'连连看',hunt:'错字猎人'};
  const prefix='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
    '<div class="tag" style="margin-bottom:0">第 '+(S.qi+1)+' / '+S.queue.length+' 关</div>'+
    '<div style="font-size:12px;color:#7b7568;font-weight:700">🎮 '+KNAME[q.k]+'</div></div>';
  if(q.k==='choice'){
    const p=q.p;
    card(prefix+'<div class="src">出自《'+esc(p.t)+'》 · '+(p.kind==='通假'?'通假字':'形近字')+' · 选出教材原字</div>'+ctxHtml(p)+'<div class="sent">'+masked(p)+'</div>'+
      '<div class="opts">'+p.opts.map((o,i)=>'<button class="opt" data-o="'+esc(o)+'">'+esc(o)+'</button>').join('')+
      '</div><div class="hint" id="hint"></div>');
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=b.dataset.o;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      if(o===p.a){b.classList.add('ok');addRight();$('#hint').innerHTML='✓ 写对了！'+(p.note?' <span style="color:#8a6520">'+esc(p.note)+'</span>':'')}
      else{b.classList.add('no');addWrong(p,o);$('#hint').innerHTML='✗ 应为 <em style="color:#c1453b;font-style:normal;font-weight:700">'+esc(p.a)+'</em>（《'+esc(p.t)+'》）'+(p.note?' <span style="color:#8a6520">'+esc(p.note)+'</span>':'')}
      setTimeout(next,700);
    });
  } else if(q.k==='write'){
    const p=q.p;
    card(prefix+'<div class="tag" style="background:#fbe9d9;color:#a5672a">提笔验字 · 真写一个字</div>'+
      '<div class="src">出自《'+esc(p.t)+'》 · 不给拼音，凭记忆写出空缺的那个字</div>'+
      ctxHtml(p)+'<div class="sent">'+masked(p)+'</div>'+
      '<input class="inp" id="zin" maxlength="1" autocomplete="off" placeholder="写这里">'+
      '<button class="btn" id="zok">确认</button><div class="hint" id="hint"></div>');
    const inp=$('#zin');inp.focus();
    const go=()=>{
      const v=(inp.value||'').trim().slice(-1);if(!v)return;
      $('#zok').disabled=true;inp.disabled=true;S.writeTotal++;
      if(v===p.a){S.writeRight++;inp.style.borderColor='#1d6b45';addRight();$('#hint').textContent='✓ 提笔就对，这个字记住了'}
      else{inp.style.borderColor='#c1453b';addWrong(p,v);$('#hint').innerHTML='✗ 应为 <em style="color:#c1453b;font-style:normal;font-weight:700">'+esc(p.a)+'</em>'}
      setTimeout(next,750);
    };
    $('#zok').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};
  } else if(q.k==='match'){
    const pool=q.pairs,n=pool.length,r=mulberry32(S.week+S.qi*31+7);
    /* 用「配对索引」而不是句子文本来判定，避免同篇重复分句撞车；
       右列除正确下句外，混入 DECOY 条同篇干扰句，外观完全一样 */
    const L=shuffle(pool.map((x,i)=>({v:x.a,i:i})),r);
    const R=shuffle(pool.map((x,i)=>({v:x.b,i:i,d:0}))
      .concat((q.decoys||[]).map((v,j)=>({v:v,i:'d'+j,d:1}))),r);
    S.match={n,done:0,sel:null};
    card(prefix+'<div class="src">连连看 · 《'+esc(q.t)+'》 · 点左半句，再点它后面那一句（'+n+' 对，右列混有同篇干扰句）</div>'+
      '<div class="match"><div class="mcol" id="mcL">'+L.map(x=>'<div class="mi" data-side="L" data-i="'+x.i+'">'+esc(x.v)+'</div>').join('')+'</div>'+
      '<div class="mcol" id="mcR">'+R.map(x=>'<div class="mi" data-side="R" data-i="'+x.i+'">'+esc(x.v)+'</div>').join('')+'</div></div>'+
      '<div class="hint" id="hint">先点左边一句</div>');
    document.querySelectorAll('.mi').forEach(el=>el.onclick=()=>{
      const side=el.dataset.side,i=el.dataset.i,st=S.match;if(el.classList.contains('gone'))return;
      if(side==='R'&&st.sel===null){$('#hint').textContent='先点左边的上句';return}
      if(side==='L'){document.querySelectorAll('.mi[data-side="L"]').forEach(x=>x.classList.remove('sel'));st.sel=+i;el.classList.add('sel');$('#hint').textContent='再点右边它后面那一句';return}
      if(String(i).charAt(0)==='d'){
        el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),320);
        $('#hint').textContent='这句是《'+esc(q.t)+'》的干扰项，本关没有它的上一句';
        st.sel=null;document.querySelectorAll('.mi[data-side="L"]').forEach(x=>x.classList.remove('sel'));return;
      }
      const left=document.querySelector('.mi[data-side="L"].sel');
      if(st.sel===+i){
        el.classList.add('gone');left.classList.add('gone');st.done++;addRight();$('#hint').textContent='✓ 连上了！还剩 '+(n-st.done)+' 对';
        if(st.done>=n)setTimeout(next,600);
      }else{el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),320);S.combo=0;hud();$('#hint').textContent='不是这一句，再试试'}
      st.sel=null;document.querySelectorAll('.mi[data-side="L"]').forEach(x=>x.classList.remove('sel'));
    });
  } else if(q.k==='hunt'){
    const p=q.p;const wrongOpt=p.opts.find(o=>o!==p.a)||p.a;
    const chars=p.s.split('');chars[p.pos]=wrongOpt;
    S.hunt={p,wrongOpt,picked:false};
    card(prefix+'<div class="tag" style="background:#fbe0dd;color:#a8332a">错字猎人</div>'+
      '<div class="src">这句话里混进了一个错字 · 先点出它，再选教材原字</div>'+
      ctxHtml(p)+'<div class="sent hunt" id="hsent">'+chars.map((c,i)=>'<span data-i="'+i+'">'+esc(c)+'</span>').join('')+'</div>'+
      '<div id="hopts"></div><div class="hint" id="hint">找出写错的那一个字</div>');
    document.querySelectorAll('#hsent span').forEach(el=>el.onclick=()=>{
      const i=+el.dataset.i;
      if(i!==p.pos){S.combo=0;hud();$('#hint').textContent='不是这个字，再找找';return}
      document.querySelectorAll('#hsent span').forEach(x=>x.classList.remove('picked'));
      el.classList.add('picked');S.hunt.picked=true;
      $('#hopts').innerHTML='<div class="opts" style="margin-top:10px">'+p.opts.map(o=>'<button class="opt" data-o="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';
      $('#hint').textContent='找到啦！那教材原字是？';
      document.querySelectorAll('#hopts .opt').forEach(b=>b.onclick=()=>{
        const o=b.dataset.o;document.querySelectorAll('#hopts .opt').forEach(x=>x.disabled=true);
        if(o===p.a){b.classList.add('ok');addRight();$('#hint').textContent='✓ 揪出来了！'}
        else{b.classList.add('no');addWrong(p,o);$('#hint').innerHTML='✗ 正确是 <em style="color:#c1453b;font-style:normal;font-weight:700">'+esc(p.a)+'</em>'}
        setTimeout(next,700);
      });
    });
  }
}

function finish(){
  S.elapsed=Math.round((Date.now()-S.t0)/1000);S.done=true;
  localStorage.setItem('gm_done_'+S.wkey,'1');
  const rate=S.total?S.right/S.total:0;
  const d={v:1,c:S.cls,n:S.name,w:S.week,k:S.wkey,d:today(),s:S.score,
    r:Math.round(rate*100),wr:S.writeTotal?Math.round(S.writeRight/S.writeTotal*100):0,
    t:S.total,tc:S.elapsed,e:S.wrong.slice(0,80).map(x=>[x.a,x.t].join('|')),
    k2:S.attempts,mc:S.maxCombo,f:S.free?1:0,
    u:S.u,dv:S.dv,sw:S.sw};
  const code=makeCode(d);
  localStorage.setItem('gm_lastcode_'+S.wkey,code);
  save();
  renderResult(code,d,rate);
}
const PRAISE=["天生我材必有用，千金散尽还复来","山不厌高，海不厌深","江山如画，一时多少豪杰","久在樊笼里，复得返自然","东风夜放花千树","人生得意须尽欢，莫使金樽空对月"];

/* 四大题型固定展示：无论今天是不是开放日，都让学生一眼看到四种玩法都在、各几关。
   数字直接读 CFG，老师改题量时这张卡片自动跟着变，不会出现「说明写了、游戏里没有」。 */
function mixCard(){
  const items=[
    ['🔍','火眼金睛 · 选字',CFG.N_CHOICE+' 道','只考通假字 / 形近字，四选一'],
    ['✍️','提笔验字',CFG.N_WRITE+' 个','不给拼音，凭记忆真写一个字'],
    ['🔗','连连看',CFG.N_MATCH+' 关','同篇短分句配对，混入同篇干扰句'],
    ['🕵️','错字猎人',CFG.N_HUNT+' 道','先揪出混进句子的错字，再选回教材原字']
  ];
  const total=CFG.N_CHOICE+CFG.N_WRITE+CFG.N_MATCH+CFG.N_HUNT;
  return '<div style="margin:14px 0;padding:14px;background:#fffdf8;border:1px solid #e6ddc9;border-radius:14px">'+
    '<div style="font-size:13px;font-weight:700;color:#2f5d50;margin-bottom:10px">🎮 本周四大关卡 · 共 '+total+' 关（四种玩法一个都不少）</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+items.map(x=>
      '<div style="background:#faf6ee;border:1px solid #eee4cf;border-radius:10px;padding:10px">'+
      '<div style="font-size:13px;font-weight:700;color:#2b2b28">'+x[0]+' '+x[1]+'</div>'+
      '<div style="font-size:16px;color:#c9972f;font-weight:700;margin:2px 0">'+x[2]+'</div>'+
      '<div style="font-size:11px;color:#7b7568;line-height:1.5">'+x[3]+'</div></div>').join('')+
    '</div></div>';
}
function startGame(free){
  const c=$('#cls').value,n=$('#nm').value,key=c+'/'+n;
  const expect=BANK.codes[key];
  const typed=($('#ucode').value||'').trim().toUpperCase();
  const bind=bindInfo(), same=!!(bind&&bind.c===c&&bind.n===n);
  let code;
  if(same){code=bind.code}
  else{
    if(!expect||typed!==expect){alert('学号不对。\n\n请输入名单里你自己的 10 位学号（老师测试号是 TEST01），注意别填成同学的。\n换名字刷题会被记录并上报老师。');return}
    code=typed;
  }
  let sw=0;
  if(bind&&!same){
    sw=1;
    if(!confirm('这台设备上一次是 '+bind.c+' '+bind.n+' 在使用。\n\n换名字会被记录并上报老师，确定要继续吗？'))return;
  }
  if(!same)setBind({c,n,code});
  newRun(c,n,free,{u:uidOf(code),dv:devId(),sw});
  hud();showQ();
}
function home(){
  const wk=weekNo(new Date()),k=weekKey(new Date());
  const canPlay=isOpenDay();
  const prev=load(), bind=bindInfo();
  const classes=Object.keys(BANK.roster);
  let h='<div class="title">📜 古诗文闯关</div><div class="sub">'+k+' · '+openDaysText()+' 开放 · 60 篇全覆盖 · 约 12–14 分钟</div>';
  h+='<label>班级</label><select id="cls">'+classes.map(c=>'<option>'+esc(c)+'</option>').join('')+'</select>';
  h+='<label>姓名（点选自己，不要手打）</label><select id="nm"></select>';
  h+='<label>学号（填名单里你自己的 10 位学号）</label><input class="ucode" id="ucode" maxlength="12" autocomplete="off" spellcheck="false" placeholder="例如 2024000001">';
  if(bind)h+='<div class="note">🔒 这台设备上次是 <b>'+esc(bind.c)+' '+esc(bind.n)+'</b> 使用，本机已记住其学号；<b>换成别人会被记录并上报老师</b>。</div>';
  else h+='<div class="note">🔒 首次进入需要输入<b>你自己的学号</b>（老师测试号 TEST01），本机之后会记住。别填成同学的学号，换名字刷题老师那边能看到。</div>';
  h+=mixCard();
  if(!canPlay)h+='<div class="note">⏰ 本周计分关卡 <b>'+openDaysText()+'</b> 开放（不限时段）。今天可以先开「练习模式」把下面四种题型都练一遍，练习不计入成绩。</div>';
  else h+='<div class="note">✅ 计分关卡已开放（今天 周'+DAYCN[new Date().getDay()]+'）。本周 60 篇全覆盖，约 '+(CFG.N_CHOICE+CFG.N_WRITE+CFG.N_MATCH+CFG.N_HUNT)+' 关；<b>同题型连着做、只打乱篇目顺序</b>，不会来回跳题型，也不会连着考同一册。请真的把字写出来。</div>';
  if(prev&&!prev.done&&prev.queue&&prev.qi<prev.queue.length)h+='<button class="btn ghost" id="contBtn">继续上次的进度（第 '+(prev.qi+1)+' 关）</button>';
  h+='<button class="btn" id="startBtn">'+(canPlay?'开始本周闯关':'开始练习模式')+'</button>';
  if(!canPlay)h+='<button class="btn ghost" id="startFree">只练不计分</button>';
  h+='<div class="mini">考点字只取《高考默写30天练习（精简版）》与《清单02 易错字清单》里标注的字，题干与教材逐字校验 · 题型分块集中、只打乱篇目顺序 · 选择题只考通假 / 形近 · 提笔验字不给拼音 · 易混句式会给出上下文</div>';
  card(h);
  const fill=()=>{
    const c=$('#cls').value;
    $('#nm').innerHTML=(BANK.roster[c]||[]).map(n=>'<option>'+esc(n)+'</option>').join('');
    if(bind&&bind.c===c)$('#nm').value=bind.n;
  };
  $('#cls').onchange=fill;fill();
  $('#startBtn').onclick=()=>startGame(!canPlay);
  if($('#startFree'))$('#startFree').onclick=()=>startGame(true);
  if($('#contBtn'))$('#contBtn').onclick=()=>{S=prev;hud();showQ()};
}
home();

</script>
</body>
</html>
